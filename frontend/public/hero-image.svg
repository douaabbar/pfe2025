<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background Elements -->
  <circle cx="250" cy="200" r="150" fill="#EFF6FF" />
  <ellipse cx="300" cy="300" rx="180" ry="50" fill="#DBEAFE" />
  
  <!-- Doctor Character -->
  <g transform="translate(170, 120)">
    <!-- Head -->
    <circle cx="75" cy="50" r="40" fill="#FDBA74" />
    
    <!-- Face -->
    <circle cx="65" cy="40" r="5" fill="#1E3A8A" /> <!-- Left eye -->
    <circle cx="85" cy="40" r="5" fill="#1E3A8A" /> <!-- Right eye -->
    <path d="M65 60 Q 75 70 85 60" fill="none" stroke="#1E3A8A" stroke-width="3" /> <!-- Smile -->
    
    <!-- Hair -->
    <path d="M45 30 Q 50 15 75 10 Q 100 15 105 30" fill="#422006" />
    
    <!-- Lab Coat -->
    <path d="M35 90 L 50 170 L 100 170 L 115 90" fill="white" stroke="#94A3B8" stroke-width="2" />
    <rect x="65" y="90" width="20" height="80" fill="white" stroke="#94A3B8" stroke-width="2" />
    
    <!-- Stethoscope -->
    <path d="M65 100 Q 55 110 50 125 Q 45 140 55 145" fill="none" stroke="#2563EB" stroke-width="4" />
    <circle cx="55" cy="145" r="6" fill="#3B82F6" />
    
    <!-- Arms -->
    <rect x="35" y="90" width="15" height="50" rx="7" fill="#FDBA74" />
    <rect x="100" y="90" width="15" height="50" rx="7" fill="#FDBA74" />
  </g>
  
  <!-- Medical Symbols Floating -->
  <g transform="translate(80, 140)">
    <path d="M10 0 L10 40 M-10 20 L30 20" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <g transform="translate(380, 150)">
    <path d="M0 0 C15 10 15 30 0 40 C-15 30 -15 10 0 0 Z" fill="none" stroke="#2563EB" stroke-width="4" />
    <path d="M0 0 L0 40" fill="none" stroke="#2563EB" stroke-width="4" />
    <path d="M-15 20 L15 20" fill="none" stroke="#2563EB" stroke-width="4" />
  </g>
  
  <g transform="translate(100, 250)">
    <path d="M0 0 L30 0 L30 30 L0 30 Z" fill="none" stroke="#2563EB" stroke-width="4" />
    <path d="M15 0 L15 30 M0 15 L30 15" fill="none" stroke="#2563EB" stroke-width="4" />
  </g>
  
  <!-- Health Icons -->
  <g transform="translate(350, 240)">
    <!-- Heart Rate -->
    <path d="M0 20 L10 20 L15 10 L25 30 L35 0 L45 20 L60 20" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Medical Chat Bubbles -->
  <g transform="translate(120, 80)">
    <rect x="0" y="0" width="80" height="40" rx="15" fill="#93C5FD" />
    <text x="40" y="25" text-anchor="middle" fill="#1E3A8A" font-family="Arial" font-size="14">Health AI</text>
  </g>
  
  <g transform="translate(340, 90)">
    <rect x="0" y="0" width="80" height="40" rx="15" fill="#BFDBFE" />
    <text x="40" y="25" text-anchor="middle" fill="#1E3A8A" font-family="Arial" font-size="14">MedAI</text>
  </g>
</svg>